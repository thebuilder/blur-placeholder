questions:
  - id: install-package
    question: How do I install Blur Placeholder in my Umbraco site?
    expected:
      - Add the TheBuilder.BlurPlaceholder package to the Umbraco web project with dotnet add package TheBuilder.BlurPlaceholder.
      - The package registers its services and backoffice extension automatically.
      - The first startup installs the string data type and adds blurPlaceholder to the default Image media type.
      - Blur Placeholder supports Umbraco CMS 17.1 through 18.x.
    routes:
      - /quickstart

  - id: choose-an-algorithm
    question: Which output format should I choose, and what does each one store?
    expected:
      - Webp is the default and stores a browser-ready data:image/webp;base64 URL that needs no decoder.
      - BlurHash stores a short configurable text hash and suits frontends that already decode it.
      - ThumbHash encodes aspect ratio, average color, and transparency.
      - Setting DecodeToDataUrl to true converts a native hash to a WebP data URL before storage.
    routes:
      - /overview

  - id: identify-the-representation
    question: How do I tell which representation a stored blurPlaceholder value uses?
    expected:
      - The property always holds one self-describing string, never a JSON envelope.
      - A value starting with data:image/webp;base64, is a WebP data URL.
      - A value starting with blurhash: is native BlurHash text.
      - A value starting with thumbhash: is base64-encoded native ThumbHash bytes.
    routes:
      - /overview

  - id: request-through-delivery-api
    question: How do I request the placeholder through the Delivery API?
    expected:
      - Enable the Delivery API and its media endpoints in the host application's appsettings.json.
      - Request the property explicitly with expand=properties[$all] and fields=properties[blurPlaceholder].
      - The value arrives as a plain string in the media item's properties object.
      - Requesting it explicitly keeps the extra payload opt-in and leaves the default response shape unchanged.
    routes:
      - /delivery-api

  - id: decode-a-native-hash
    question: How do I render a native BlurHash or ThumbHash value in Next.js or Nuxt?
    expected:
      - Strip the blurhash: or thumbhash: prefix before calling the matching decoder.
      - Decode in a server-only module so the decoder and sharp never reach the browser.
      - Base64-decode thumbhash bytes before calling thumbHashToRGBA.
      - BlurHash carries no aspect ratio, so derive the decode size from the media dimensions.
    routes:
      - /delivery-api

  - id: configure-defaults
    question: What are the default configuration values and what happens if I set an invalid one?
    expected:
      - Algorithm defaults to Webp, DecodeToDataUrl and BackfillExisting to true, and RetryInterval to 12:00:00.
      - Webp.MaximumDimension defaults to 16 and Webp.Quality to 60.
      - The whole BlurPlaceholder section can be omitted when the default WebP output is appropriate.
      - An invalid value fails application startup and reports the configuration key and accepted range.
    routes:
      - /quickstart

  - id: backfill-existing-media
    question: How are existing images processed, and what happens if I change the output settings?
    expected:
      - BackfillExisting runs one pass over existing images for each output-settings fingerprint.
      - Changing a setting that affects generated bytes produces a new fingerprint and permits one more pass.
      - Maintenance checkpoints the next media-library page, so an interrupted pass resumes instead of restarting.
      - Setting Enabled to false stops generation and maintenance without deleting existing values.
    routes:
      - /operations

  - id: property-missing-or-empty
    question: Why is the Blur placeholder property missing from a media item, or why is its value empty?
    expected:
      - Restart the host after installing the package, then check the migration log and the health check.
      - A conflicting blurPlaceholder property or an incompatible editor is reported as a schema compatibility error and is never overwritten.
      - The item must use the default Image media type with a supported image in umbracoFile.
      - Transient file-system or blob-storage failures leave the value empty for the next maintenance pass.
    routes:
      - /operations

  - id: schema-ownership
    question: Who owns the blurPlaceholder data type, and how should Deploy or uSync handle it?
    expected:
      - The package migration owns the generated data type and property.
      - Sites that disable unattended migrations must apply the package migration during deployment.
      - Deploy and uSync projects should exclude project-authored copies of the package-owned data type.
      - An existing property is reused only when its data type already uses the package's plain-string schema and read-only preview UI.
    routes:
      - /operations

  - id: licensing-and-attribution
    question: How is Blur Placeholder licensed, and what third-party code does it include?
    expected:
      - The package is released under the MIT license.
      - It uses blurhash.net for BlurHash encoding and decoding and ImageSharp for image processing.
      - The vendored C# ThumbHash port is credited to Glitched Polygons GmbH, with Evan Wallace credited for the original algorithm.
      - The full upstream MIT notice and the pinned source commit are recorded in THIRD-PARTY-NOTICES.md.
    routes:
      - /license
