name: Verify package

on:
  workflow_call:
    inputs:
      package-version:
        description: Version applied to the NuGet package and Umbraco manifest.
        type: string
        default: 0.1.0
      release-tag:
        description: GitHub Release tag linked from NuGet release notes.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  client-and-docs:
    name: Client and docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client and docs
        run: pnpm build

      - name: Verify production decoders
        run: pnpm --filter @thebuilder/blur-placeholder-client test:decoders

  dotnet:
    name: .NET (Umbraco ${{ matrix.umbraco-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco-version:
          - 17.1.0
          - 17.*
          - 18.*
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test package
        run: >-
          dotnet test tests/TheBuilder.BlurPlaceholder.Tests/TheBuilder.BlurPlaceholder.Tests.csproj
          --configuration Release
          '-p:UmbracoVersion=${{ matrix.umbraco-version }}'

  sample:
    name: Sample host
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build sample host
        run: dotnet build samples/TheBuilder.BlurPlaceholder.Example/TheBuilder.BlurPlaceholder.Example.csproj --configuration Release

  package:
    name: Package
    needs:
      - client-and-docs
      - dotnet
      - sample
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install backoffice dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack NuGet package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          arguments=(
            src/TheBuilder.BlurPlaceholder/TheBuilder.BlurPlaceholder.csproj
            --configuration Release
            --output artifacts
            "-p:Version=$PACKAGE_VERSION"
            -p:ContinuousIntegrationBuild=true
          )

          if [[ -n "$RELEASE_TAG" ]]; then
            arguments+=("-p:PackageReleaseNotes=https://github.com/thebuilder/blur-placeholder/releases/tag/$RELEASE_TAG")
          fi

          dotnet pack "${arguments[@]}"

      - name: Validate NuGet archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          package="$(find artifacts -name '*.nupkg' -print -quit)"
          unzip -t "$package"
          entries="$(unzip -Z1 "$package")"
          nuspec="$(unzip -p "$package" TheBuilder.BlurPlaceholder.nuspec)"
          manifest_version="$(unzip -p "$package" staticwebassets/App_Plugins/TheBuilderBlurPlaceholder/umbraco-package.json | jq -r '.version')"

          grep -Fqx 'README.md' <<< "$entries"
          grep -Fqx 'LICENSE' <<< "$entries"
          grep -Fqx 'THIRD-PARTY-NOTICES.md' <<< "$entries"
          grep -Fqx 'staticwebassets/App_Plugins/TheBuilderBlurPlaceholder/umbraco-package.json' <<< "$entries"
          grep -Fqx 'staticwebassets/App_Plugins/TheBuilderBlurPlaceholder/the-builder-blur-placeholder.js' <<< "$entries"
          test "$manifest_version" = "$PACKAGE_VERSION"
          grep -Fq "<version>$PACKAGE_VERSION</version>" <<< "$nuspec"

          if [[ -n "$RELEASE_TAG" ]]; then
            grep -Fq "<releaseNotes>https://github.com/thebuilder/blur-placeholder/releases/tag/$RELEASE_TAG</releaseNotes>" <<< "$nuspec"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheBuilder.BlurPlaceholder-package
          path: artifacts/*.nupkg
          if-no-files-found: error
